<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplement Tracker</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#111; color:#eee; margin:0; padding:16px; }
  h1 { font-size:1.4em; text-align:center; }
  h2 { margin-top:24px; border-bottom:1px solid #444; padding-bottom:4px; }
  label { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid #222; font-size:1em; }
  input[type=checkbox] { width:22px; height:22px; }
  .done { text-decoration: line-through; color:#888; }
  #bar-container { background:#333; border-radius:8px; overflow:hidden; height:16px; margin:10px 0; }
  #bar { background:#4caf50; height:100%; width:0%; transition:width .3s; }
  button { margin-top:20px; width:100%; padding:12px; font-size:1em; background:#c0392b; color:#fff; border:none; border-radius:8px; }
</style>
</head>
<body>
<h1>Daily Supplement Tracker</h1>
<div id="bar-container"><div id="bar"></div></div>
<div id="app"></div>
<button onclick="resetToday()">Reset Today's Checklist</button>

<script>
const schedule = {
  "Morning \u2600\ufe0f": [
    "S-Acetyl L-Glutathione (20-30 min before breakfast)",
    "Adderall (80 mg) - with breakfast",
    "Escitalopram (30 mg) - with breakfast",
    "Telmisartan (40 mg) - with breakfast",
    "Omega-3 High DHA - with breakfast",
    "Magnesium L-Threonate - with breakfast"
  ],
  "Nighttime \ud83c\udf19": [
    "Berberine Phytosome - with dinner",
    "L-Theanine (200 mg) - before bed",
    "Quercetin & Astragaloside (50 mg) - before bed",
    "Magnesium Glycinate - before bed"
  ]
};

const weeklyAddIns = {
  2: ["ErinaMax (Lion's Mane) - Tuesday boost"],
  4: ["Ashwagandha - Thursday boost", "ErinaMax (Lion's Mane) - Thursday boost"],
  0: ["Multivitamin - Sunday reset", "Vitamin D - Sunday reset", "Calcium - Sunday reset"]
};

function todayKey() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function getState() {
  const key = "supp_" + todayKey();
  return JSON.parse(localStorage.getItem(key) || "{}");
}

function saveState(state) {
  const key = "supp_" + todayKey();
  localStorage.setItem(key, JSON.stringify(state));
}

function resetToday() {
  const key = "supp_" + todayKey();
  localStorage.removeItem(key);
  render();
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  const state = getState();
  let total = 0, checked = 0;

  const dow = new Date().getDay();
  const fullSchedule = Object.assign({}, schedule);
  if (weeklyAddIns[dow]) {
    fullSchedule["Today's Weekly Add-Ins \ud83d\udcc5"] = weeklyAddIns[dow];
  }

  for (const section in fullSchedule) {
    const h2 = document.createElement("h2");
    h2.textContent = section;
    app.appendChild(h2);
    fullSchedule[section].forEach((item, idx) => {
      const id = section + "_" + idx;
      total++;
      const lbl = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!state[id];
      if (cb.checked) { checked++; lbl.classList.add("done"); }
      cb.onchange = () => {
        const s = getState();
        s[id] = cb.checked;
        saveState(s);
        render();
      };
      const span = document.createElement("span");
      span.textContent = item;
      lbl.appendChild(cb);
      lbl.appendChild(span);
      app.appendChild(lbl);
    });
  }

  const pct = total ? Math.round((checked/total)*100) : 0;
  document.getElementById("bar").style.width = pct + "%";
}

render();
</script>
</body>
</html>
